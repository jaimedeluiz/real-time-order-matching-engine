name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} (${{ matrix.cxx }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cxx: [g++, clang++]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up C++ compiler
        run: |
          echo "CXX=${{ matrix.cxx }}" >> $GITHUB_ENV

      - name: Build and Run Tests (Release -O3)
        run: |
          make clean
          make test

      - name: Run AddressSanitizer & UBSan Tests
        run: |
          make clean
          make test ASAN=1

      - name: Run Benchmarks
        run: |
          make clean
          make bench BENCH_ARGS="--quick"

      - name: Verify CMake Build
        run: |
          cmake -B build-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake --config Release
          ctest --test-dir build-cmake --output-on-failure
